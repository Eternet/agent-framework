name: Python - Create Docs

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write
env:
  # Configure a constant location for the uv cache
  UV_CACHE_DIR: /tmp/.uv-cache

jobs:
  python-build-docs:
    if: >-
      ${{
        (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'python-'))
        && (
          !contains(fromJSON('["pull_request","pull_request_target"]'), github.event_name)
          || github.event.pull_request.head.repo.full_name == github.repository
          || (github.event_name == 'pull_request_target' && github.event.pull_request.merged == true)
        )
        && (
          github.event_name != 'workflow_run'
          || github.event.workflow_run.head_repository.full_name == github.repository
        )
      }}
    name: Python Build Docs
    runs-on: [self-hosted, Linux]
    environment: "integration"
    env:
      UV_PYTHON: "3.11"
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v6
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version-file: "python/pyproject.toml"
          enable-cache: true
          cache-suffix: ${{ runner.os }}-${{ env.UV_PYTHON }}
          cache-dependency-glob: "**/uv.lock"
      - name: Install dependencies
        run: uv sync --all-packages --dev --docs
      - name: Build the docs
        run: uv run poe docs-full
    #  Upload docs to learn gh
